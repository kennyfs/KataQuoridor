# KataQuoridor gatekeeper for Quoridor I/O v2 nets (docs/QuoridorIOv2.md, step 3).
# Same as gatekeeper_quoridor.cfg, with the rules of selfplay_quoridor_v2.cfg (the same maxPlies, repetitionDrawCount
# and timeBonusPerPly).
# Gatekeeper games are always the standard game (komi -0.5, 10/10 walls): the gatekeeper refuses komi or
# fence-handicap randomization. A draw (maxPlies or repetition) counts half a point for each side.


# Logs------------------------------------------------------------------------------------

logSearchInfo = false
logMoves = false
logGamesEvery = 10
logToStdout = true

# Match-----------------------------------------------------------------------------------

numGameThreads = 256
maxPlies = 300  # Draw at this many plies (a game rule, docs/QuoridorIOv2.md); use the same rules as selfplay
repetitionDrawCount = 3  # Draw at the third occurrence of a position, as in self-play
timeBonusPerPly = 0.05  # Must equal the self-play value: nets learn the score for it (placeholder, see selfplay_quoridor_v2.cfg)
numGamesPerGating = 200

allowResignation = true
resignThreshold = -0.90
resignConsecTurns = 5

# Disabled, since we're not using any root noise and such
# clearBotBeforeSearch = true

# Search limits-----------------------------------------------------------------------------------
maxVisits = 150
numSearchThreads = 1

# GPU Settings-------------------------------------------------------------------------------

nnMaxBatchSize = 256
nnCacheSizePowerOfTwo = 21
nnMutexPoolSizePowerOfTwo = 15
numNNServerThreadsPerModel = 2
nnRandomize = true

# CUDA GPU settings--------------------------------------
# cudaDeviceToUse = 0 #use device 0 for all server threads (numNNServerThreadsPerModel) unless otherwise specified per-model or per-thread-per-model
# cudaDeviceToUseModel0 = 3 #use device 3 for model 0 for all threads unless otherwise specified per-thread for this model
# cudaDeviceToUseModel1 = 2 #use device 2 for model 1 for all threads unless otherwise specified per-thread for this model
# cudaDeviceToUseModel0Thread0 = 3 #use device 3 for model 0, server thread 0
# cudaDeviceToUseModel0Thread1 = 2 #use device 2 for model 0, server thread 1

cudaUseFP16 = auto
cudaUseNHWC = auto

# Root move selection and biases------------------------------------------------------------------------------

chosenMoveTemperatureEarly = 0.5
chosenMoveTemperatureHalflife = 19
chosenMoveTemperature = 0.2
chosenMoveSubtract = 0
chosenMovePrune = 1

useLcbForSelection = true
lcbStdevs = 5.0
minVisitPropForLCB = 0.15

# Internal params------------------------------------------------------------------------------

winLossUtilityFactor = 1.0
# Score = the Quoridor margin in moves (QuoridorNN in neuralnet/quoridornn.h)
staticScoreUtilityFactor = 0.0  # As in selfplay_quoridor_v2.cfg
dynamicScoreUtilityFactor = 0.30
dynamicScoreCenterZeroWeight = 0.25
dynamicScoreCenterScale = 0.50
noResultUtilityForWhite = 0.0
drawEquivalentWinsForWhite = 0.5

rootPruneUselessMoves = true

cpuctExploration = 1.1
cpuctExplorationLog = 0.0
fpuReductionMax = 0.2
rootFpuReductionMax = 0.1
valueWeightExponent = 0.5
policyOptimism = 1.0
rootPolicyOptimism = 0.0

subtreeValueBiasFactor = 0.35
subtreeValueBiasWeightExponent = 0.8
useNonBuggyLcb = true
useGraphSearch = true

useUncertainty = true
uncertaintyExponent = 1.0
uncertaintyCoeff = 0.25

numVirtualLossesPerThread = 1

# Quoridor (Duel) settings -------------------------------------------------
bSizes = 17
bSizeRelProbs = 1
