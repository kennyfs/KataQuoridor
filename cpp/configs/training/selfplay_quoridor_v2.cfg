# KataQuoridor self-play for Quoridor I/O v2 nets (docs/QuoridorIOv2.md, step 3).
# Differences from selfplay_quoridor.cfg: the time bonus timeBonusPerPly (now 0), static score utility off, and komi /
# fence-handicap randomization with komi compensation (section "Quoridor I/O v2 game setup" at the end).
# Komi compensation needs nets that see komi (Quoridor I/O version >= 2); with an I/O v1 net it is skipped
# (a no-op, logged once), while the randomized komi and walls still apply.


# Logs------------------------------------------------------------------------------------

logSearchInfo = false
logMoves = false
logGamesEvery = 50
logToStdout = true

# Data writing-----------------------------------------------------------------------------------

# Spatial size of tensors of data, must match -pos-len in python/train.py and be at least as large as the
# largest boardsize in the data. If you train only on smaller board sizes, you can decrease this and
# pass in a smaller -pos-len to python/train.py (e.g. modify "-pos-len 19" in selfplay/train.sh script),
# to train faster, although it may be awkward if you ever want to increase it again later since data with
# different values cannot be shuffled together.

maxDataQueueSize = 2000
# 10000 while we train without validation (synchronous_loop.sh VALIDATE=0): fewer, larger files. With validation,
# use 1000: shuffle.sh splits ~5% of the files (not rows) off as validation data, so small files keep that split from
# being too chunky.
maxRowsPerTrainFile = 10000
firstFileRandMinProp = 0.15

# Fancy game selfplay settings--------------------------------------------------------------------

# These take dominance - if a game is forked for any of these reasons, that will be the next game played.
# For forked games, "initGamesWithPolicy" is disabled.
earlyForkGameProb = 0.04  # Fork to try alternative opening variety with this probability
earlyForkGameExpectedMoveProp = 0.025  # Fork roughly within the first (boardArea * this) many moves
forkGameProb = 0.01 # Fork to try alternative crazy move anywhere in game with this probability if not early forking
forkGameMinChoices = 3   # Choose from the best of at least this many random choices
earlyForkGameMaxChoices = 12  # Choose from the best of at most this many random choices
forkGameMaxChoices = 36  # Choose from the best of at most this many random choices
# Otherwise we are playing a normal game from the empty Quoridor board.

initGamesWithPolicy = true  # Play the first few moves of a game high-temperaturely from policy
policyInitAreaProp = 0.04 # The avg number of moves to play
sidePositionProb = 0.020  # With this probability, train on refuting bad alternative moves.

cheapSearchProb = 0.75  # Do cheap searches with this probaiblity
cheapSearchVisits = 100  # Number of visits for cheap search
cheapSearchTargetWeight = 0.0  # Training weight for cheap search

reduceVisits = true  # Reduce visits when one side is winning
reduceVisitsThreshold = 0.9  # How winning a side needs to be (winrate)
reduceVisitsThresholdLookback = 3  # How many consecutive turns needed to be that winning
reducedVisitsMin = 100  # Minimum number of visits (never reduce below this)
reducedVisitsWeight = 0.1  # Minimum training weight

normalAsymmetricPlayoutProb = 0.0  # Must be 0 for Quoridor (no playout doubling advantage input); nonzero is warned and forced to 0
maxAsymmetricRatio = 8.0 # Max ratio to unbalance visits between players

policySurpriseDataWeight = 0.5  # This proportion of training weight should be concentrated on surprising moves
valueSurpriseDataWeight = 0.1   # This proportion of training weight should be concentrated on surprising position results

switchNetsMidGame = true  # When a new neural net is loaded, switch to it immediately instead of waiting for new game

# Match-----------------------------------------------------------------------------------

numGameThreads = 256
# Game rules (docs/QuoridorIOv2.md). A game that reaches maxPlies plies without a pawn on its goal is a draw
# (default 300). Draws are written to training data (value 0.5 / 0.5, no lead). The old
# maxMovesPerGame / cutoffMoves may still be given, but must equal maxPlies.
maxPlies = 300
# Draw the moment a position (pawns, walls, walls left, side to move) occurs for the N-th time (default 0 = off).
# Ends shuffles in equilibrium positions long before maxPlies.
repetitionDrawCount = 3
# Per game: rule on in 75% of games (N = 3 in 90% of those, 4 in 10%), off in 25%. Nets must play well with the rule
# (self-play, KataQuoridor-only matches) and without it (arena vs other engines, the standard GTP config, where only
# the maxPlies draw applies); I/O v3 nets see whether it is on. When quoridorRepetitionDrawProb is given it replaces
# repetitionDrawCount above for games from the empty board; forks keep their game's rule.
quoridorRepetitionDrawProb = 0.75
quoridorRepetitionDrawCounts = 3,4
quoridorRepetitionDrawCountWeights = 0.9,0.1
# The time bonus of the utility score (default 0): u = s + sign(s) * timeBonusPerPly * (maxPlies - plies).
# lambda is a property of the training run: nets learn the score for this value, and search must use the same
# value (gatekeeper_quoridor_v2.cfg, and gtp_quoridor.cfg when playing these nets). It must also match the data the
# net is trained on: data written with another lambda has other score targets (convert it, see
# python/quoridor_convert_tdata_lambda0.py).
# 0 since 2026-10-02 (run3 used 0.05 up to run3-s21886976-d3911658): the repetition draw already ends the cycling
# games early and the maxPlies draw still makes a winner progress, so the bonus isn't needed; with 0 the score
# (scoreMean) is the lead, comparable across nets, and the short-term score error is not inflated by the bonus.
timeBonusPerPly = 0
# Initial walls (fence handicap), default 10 each.
# blackInitialWalls = 10
# whiteInitialWalls = 10

# Search limits-----------------------------------------------------------------------------------

maxVisits = 600
numSearchThreads = 1

# GPU Settings-------------------------------------------------------------------------------

nnMaxBatchSize = 256
nnCacheSizePowerOfTwo = 21
nnMutexPoolSizePowerOfTwo = 15
numNNServerThreadsPerModel = 1
nnRandomize = true

# CUDA GPU settings--------------------------------------
# cudaDeviceToUse = 0 #use device 0 for all server threads (numNNServerThreadsPerModel) unless otherwise specified per-model or per-thread-per-model
# cudaDeviceToUseModel0 = 3 #use device 3 for model 0 for all threads unless otherwise specified per-thread for this model
# cudaDeviceToUseModel1 = 2 #use device 2 for model 1 for all threads unless otherwise specified per-thread for this model
# cudaDeviceToUseModel0Thread0 = 3 #use device 3 for model 0, server thread 0
# cudaDeviceToUseModel0Thread1 = 2 #use device 2 for model 0, server thread 1

cudaUseFP16 = auto
cudaUseNHWC = auto

# Root move selection and biases------------------------------------------------------------------------------

chosenMoveTemperatureEarly = 0.75
chosenMoveTemperatureHalflife = 19
chosenMoveTemperature = 0.15
chosenMoveSubtract = 0
chosenMovePrune = 1

rootNoiseEnabled = true
rootDirichletNoiseTotalConcentration = 10.83
rootDirichletNoiseWeight = 0.25

rootDesiredPerChildVisitsCoeff = 2
rootNumSymmetriesToSample = 2  # Quoridor has only 2 symmetries (identity, left-right mirror); nneval caps it at 2 anyway

useLcbForSelection = true
lcbStdevs = 5.0
minVisitPropForLCB = 0.15

# Internal params------------------------------------------------------------------------------

winLossUtilityFactor = 1.0
staticScoreUtilityFactor = 0.0  # Dynamic score utility only (chosen when u had a time bonus, offset by about timeBonusPerPly * maxPlies; kept with lambda = 0)
dynamicScoreUtilityFactor = 0.30
dynamicScoreCenterZeroWeight = 0.25
dynamicScoreCenterScale = 0.50
noResultUtilityForWhite = 0.0
drawEquivalentWinsForWhite = 0.5

rootEndingBonusPoints = 0.5
rootPruneUselessMoves = true

rootPolicyTemperatureEarly = 1.25
rootPolicyTemperature = 1.1

cpuctExploration = 1.1
cpuctExplorationLog = 0.0
fpuReductionMax = 0.2
rootFpuReductionMax = 0.0

numVirtualLossesPerThread = 1

# These parameters didn't exist historically during early KataGo runs
valueWeightExponent = 0.5
subtreeValueBiasFactor = 0.0  # Always forced to 0 for Quoridor (Setup::sanitizeParamsForQuoridor)
subtreeValueBiasWeightExponent = 0.8
useNonBuggyLcb = true
useGraphSearch = true
fpuParentWeightByVisitedPolicy = true
fpuParentWeightByVisitedPolicyPow = 2.0

# Optimistic policy channels and uncertainty-weighted playouts (as in upstream gatekeeper configs)
policyOptimism = 1.0
rootPolicyOptimism = 0.0
useUncertainty = true
uncertaintyExponent = 1.0
uncertaintyCoeff = 0.25

# Quoridor (Duel) settings -------------------------------------------------
bSizes = 17
bSizeRelProbs = 1
koRules = POSITIONAL
scoringRules = AREA
taxRules = NONE
multiStoneSuicideLegals = false
hasButtons = false
komiAuto = false
komiMean = -0.5  # The standard game (White wins iff tempo + komi > 0); must be a half-integer
komiStdev = 0
handicapProb = 0  # Go handicap stones; the Quoridor handicap is quoridorFenceHandicapProb below
fancyKomiVarying = false
sekiForkHackProb = 0
compensateAfterPolicyInitProb = 0
handicapAsymmetricPlayoutProb = 0
minAsymmetricCompensateKomiProb = 0
sgfCompensateKomiProb = 0
estimateLeadProb = 0
komiBigStdevProb = 0
komiBigStdev = 0

# Quoridor I/O v2 game setup (docs/QuoridorIOv2.md section 5) ---------------------------------------
# Komi and fence-handicap randomization of games from the empty board; they are independent.
# 70% of games have the standard komi -0.5; 30% have -0.5 +/- n (random sign), n = 1, 2, 3 weighted 60/30/10.
quoridorKomiRandomProb = 0.3
quoridorKomiRandomWeights = 0.6, 0.3, 0.1
# 10% of games give one side (random) 10 - n walls and the other 10, n = 1, 2, 3 weighted 60/30/10.
quoridorFenceHandicapProb = 0.1
quoridorFenceHandicapWeights = 0.6, 0.3, 0.1
# Komi compensation: a fair komi from PlayUtils::adjustKomiToEven with compensateKomiVisits visits. Needs I/O v2
# nets (see the top of this file).
forkCompensateKomiProb = 0.8  # Fork games (earlyForkGameProb, forkGameProb) as upstream; else they keep their komi
handicapCompensateKomiProb = 0.5  # Fence-handicap games, after the handicap is applied (replaces a random komi)
compensateKomiVisits = 20
