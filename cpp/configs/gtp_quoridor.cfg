# Config for running a KataQuoridor net over GTP (./katago gtp -config gtp_quoridor.cfg -model MODEL).
# Only Quoridor-relevant settings are listed; everything else uses the built-in defaults.
# (gtp_example.cfg is the upstream Go config and documents many keys that do nothing for Quoridor.)

logAllGTPCommunication = true
logSearchInfo = true
logToStderr = false
logDir = gtp_logs

# Rules (docs/QuoridorIOv2.md)---------------------------------------------------------------------
# Komi is set with the QTP komi command (default -0.5, the standard game); the other rules with kata-set-rule.
# maxPlies = 300            # A game that reaches this many plies without a pawn on its goal is a draw.
# repetitionDrawCount = 0   # Draw at the N-th occurrence of a position (3: threefold). Off in the standard game,
#                           # so leave it off against other engines; turn it on for KataQuoridor-only matches.
# timeBonusPerPly = 0.0     # Time bonus of the utility score: must match what the net was trained with.
#                           # lambda is a property of the training run (I/O v1 nets and the 0.1.0 release: 0;
#                           # nets from selfplay_quoridor_v2.cfg: its timeBonusPerPly). A different value only
#                           # changes terminal nodes, so the search and the net's score head disagree.
# blackInitialWalls = 10    # Initial walls (fence handicap).
# whiteInitialWalls = 10

# Search limits------------------------------------------------------------------------------------
maxVisits = 800
numSearchThreads = 4
ponderingEnabled = false

# Neural net---------------------------------------------------------------------------------------
nnCacheSizePowerOfTwo = 21
nnMutexPoolSizePowerOfTwo = 15
numNNServerThreadsPerModel = 1
nnMaxBatchSize = 16
# cudaUseFP16 = auto
# cudaUseNHWC = auto

# Utility------------------------------------------------------------------------------------------
# "Score" is the Quoridor utility score (tempo lead plus the time bonus, see docs/QuoridorIOv2.md). A little score
# utility is what makes the engine convert won positions quickly instead of shuffling its pawn.
winLossUtilityFactor = 1.0
staticScoreUtilityFactor = 0.10
dynamicScoreUtilityFactor = 0.30
dynamicScoreCenterZeroWeight = 0.25
dynamicScoreCenterScale = 0.50

# Optimistic policy channels and uncertainty-weighted playouts
policyOptimism = 1.0
rootPolicyOptimism = 0.0
useUncertainty = true
uncertaintyExponent = 1.0
uncertaintyCoeff = 0.25

# Resignation--------------------------------------------------------------------------------------
allowResignation = false
resignThreshold = -0.90
resignConsecTurns = 3
