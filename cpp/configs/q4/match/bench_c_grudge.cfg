# Benchmark (c): the candidate against three `grudge` bots that all target it (Plan §10). The bots wall the
# candidate's shortest path whenever a wall lengthens it, and move like `greedy` otherwise.
#   katago q4match -config bench_c_grudge.cfg -output c.sgfs -override-config \
#     "player_cand=search:/path/cand/model.bin.gz@200"
@include q4_match_common.cfg

players = cand, grudge
player_grudge = grudge
tables = vsGrudge
table_vsGrudge = cand, grudge>0, grudge>0, grudge>0
table_vsGrudge_openings = 50
