# katago q4gatekeeper (Plan §10): a candidate replaces the current net if it scores at least 50% in the ABAB / BABA
# tables (two copies each, seats rotated) and is not worse than the current net on the mixed benchmark (candidate /
# strong net / two weak bots) beyond the CI. Without gateBenchStrong only the ABAB tables are played.
@include q4_match_common.cfg

gateVisits = 100
gateOpenings = 40               # x 2 distinct rotations = 80 games
gateBenchOpenings = 20          # x 4 rotations, for the candidate and for the current net = 160 games
# gateBenchStrong = search:/path/to/strong/model.bin.gz@100
gateBenchWeak = greedy, randomPawn
numGameThreads = 32
