# Evaluation of the Q4 formal run (Plan §15, R8.md), every EVAL_EVERY exports: python/selfplay/q4_formal_eval.sh fills
# in NEWNET / PREVNET (the newest export and the previous evaluated one), MODELSDIR, EVALVISITS, EVALOPENINGS(2); the
# script sets seed and numGameThreads by -override-config, and appends the games to eval/ladder.jsonl. The bot tables connect every evaluation into one Bradley-Terry
# fit (python q4/rating.py, anchored at random); newVsGrudge is bench (c).
@include q4_match_common.cfg

players = NEWNET, PREVNET, random, randomPawn, greedy, basher, grudge
player_NEWNET = search:MODELSDIR/NEWNET/model.bin.gz@EVALVISITS
player_PREVNET = search:MODELSDIR/PREVNET/model.bin.gz@EVALVISITS
player_random = random
player_randomPawn = randomPawn
player_greedy = greedy
player_basher = basher
player_grudge = grudge

tables = newVsPrev, newVsBots, prevVsBots, newVsGrudge, bots
table_newVsPrev = NEWNET, PREVNET, NEWNET, PREVNET
table_newVsBots = NEWNET, greedy, basher, randomPawn
table_prevVsBots = PREVNET, greedy, basher, randomPawn
table_newVsGrudge = NEWNET, grudge>0, grudge>0, grudge>0
table_bots = greedy, basher, randomPawn, random
table_newVsPrev_openings = EVALOPENINGS2
table_newVsBots_openings = EVALOPENINGS
table_prevVsBots_openings = EVALOPENINGS
table_newVsGrudge_openings = EVALOPENINGS
table_bots_openings = EVALOPENINGS
