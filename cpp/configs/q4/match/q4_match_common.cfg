# Search, NN and rules settings shared by the q4match / q4gatekeeper configs (docs/q4/rounds/R6.md, R7.md §1).
# Every search value is spelled out: q4match loads it with SETUP_FOR_MATCH and q4gatekeeper with SETUP_FOR_OTHER (as
# Duel's match and gatekeeper), whose defaults differ, and Q4 has no hard-coded fallbacks. The search values are
# q4_selfplay.cfg's (no root noise, one root symmetry); the move selection is Duel's match_example.cfg
# (chosenMoveTemperatureEarly 0.60, then 0.20) with the Q4 halflife. rootPolicyTemperature(Early) are not set, as in
# Duel's match and gatekeeper configs (KataGo default 1.0). One search thread per player (the parallelism is
# numGameThreads).

# NN (one evaluator per net, shared by all game threads)
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
nnMaxBatchSize = 32
numNNServerThreadsPerModel = 1
nnRandomize = true

# Search (per-player maxVisits comes from the player spec)
maxVisits = 100
numSearchThreads = 1
winLossUtilityFactor = 1.0
staticScoreUtilityFactor = 0.0
dynamicScoreUtilityFactor = 0.0
cpuctExploration = 1.1
cpuctExplorationLog = 0.0
cpuctUtilityStdevScale = 0.0
fpuReductionMax = 0.2
rootFpuReductionMax = 0.0
fpuParentWeightByVisitedPolicy = true
fpuParentWeightByVisitedPolicyPow = 2.0
valueWeightExponent = 0.5
useUncertainty = true
uncertaintyExponent = 1.0
uncertaintyCoeff = 0.25
useLcbForSelection = true
lcbStdevs = 5.0
minVisitPropForLCB = 0.15
useNonBuggyLcb = true
useNoisePruning = false
rootNoiseEnabled = false
rootNumSymmetriesToSample = 1
chosenMoveTemperatureEarly = 0.60
chosenMoveTemperatureHalflife = 38
chosenMoveTemperature = 0.20
chosenMoveSubtract = 0
chosenMovePrune = 1
policyOptimism = 0.0
rootPolicyOptimism = 0.0
useGraphSearch = false
useEvalCache = false
subtreeValueBiasFactor = 0.0
avoidRepeatedPatternUtility = 0.0
antiMirror = false
playoutDoublingAdvantage = 0.0
visitCapContempt = 0
rootSymmetryPruning = false
conservativePass = false
enablePassingHacks = false
enableMorePassingHacks = false
fillDameBeforePass = false
rootEndingBonusPoints = 0.0
rootPruneUselessMoves = false
ignorePreRootHistory = false
ignoreAllHistory = false
numVirtualLossesPerThread = 1

# Games
numGameThreads = 16
maxPlies = 400
repetitionDrawCount = 3   # the self-play rules (Duel's gatekeeper: "use the same rules as selfplay")
openingPliesMin = 4
openingPliesMax = 8
openingWallProb = 0.25
seed = 12345
