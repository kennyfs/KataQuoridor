# Search and NN settings shared by the q4match / q4gatekeeper configs (docs/q4/rounds/R6.md). The search values are
# q4search_test.cfg's; the move selection is Duel's match_example.cfg (chosenMoveTemperatureEarly 0.60, then 0.20)
# with the Q4 halflife; no root noise; one search thread per player (the parallelism is numGameThreads).

# NN (one evaluator per net, shared by all game threads)
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
nnMaxBatchSize = 32
numNNServerThreadsPerModel = 1
nnRandomize = true

numSearchThreads = 1
winLossUtilityFactor = 1.0
cpuctExploration = 1.1
cpuctExplorationLog = 0.0
fpuReductionMax = 0.2
rootFpuReductionMax = 0.0
fpuParentWeightByVisitedPolicy = true
fpuParentWeightByVisitedPolicyPow = 2.0
valueWeightExponent = 0.5
useUncertainty = true
uncertaintyExponent = 1.0
uncertaintyCoeff = 0.25
useLcbForSelection = true
lcbStdevs = 5.0
minVisitPropForLCB = 0.15
useNonBuggyLcb = true
rootNoiseEnabled = false
rootPolicyTemperatureEarly = 1.25
rootPolicyTemperature = 1.1
rootNumSymmetriesToSample = 1
chosenMoveTemperatureEarly = 0.60
chosenMoveTemperatureHalflife = 38
chosenMoveTemperature = 0.20
chosenMoveSubtract = 0
chosenMovePrune = 1

# Games
numGameThreads = 16
maxPlies = 400
openingPliesMin = 4
openingPliesMax = 8
openingWallProb = 0.25
seed = 12345
