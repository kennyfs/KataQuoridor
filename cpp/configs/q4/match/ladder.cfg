# A ladder of snapshots of one training run together with the q4bots (Plan §10, R6.md). The snapshots are given on
# the command line, oldest first (init = the random net of cycle 0):
#   katago q4match -config ladder.cfg -output ladder.jsonl -summary ladder.json -override-config \
#     "player_init=search:<models>/<n0>/model.bin.gz@100,player_s1=search:<models>/<n1>/model.bin.gz@100,\
#      player_s2=...,player_s3=...,player_s4=..."
# then: python q4/rating.py ladder.jsonl --anchor random;  python q4/match_report.py ladder.jsonl
# The tables connect every player to the rest (nets with each other, with the bots, bots with bots), so that the
# Bradley-Terry fit of python/q4/rating.py is anchored at `random` through several paths.
@include q4_match_common.cfg

players = init, s1, s2, s3, s4, random, randomPawn, greedy, basher, grudge
player_random = random
player_randomPawn = randomPawn
player_greedy = greedy
player_basher = basher
player_grudge = grudge

tables = snapshots, newVsInit, newVsBots, midVsBots, vsGrudge, oldVsBots, bots
table_snapshots = s4, s3, s2, s1
table_newVsInit = s4, init, greedy, random
table_newVsBots = s4, basher, randomPawn, random
table_midVsBots = s2, s3, greedy, randomPawn
table_vsGrudge = s4, grudge>0, greedy, random
table_oldVsBots = s1, init, basher, random
table_bots = greedy, basher, randomPawn, random
table_snapshots_openings = 100
table_newVsInit_openings = 100
table_newVsBots_openings = 100
table_midVsBots_openings = 100
table_vsGrudge_openings = 100
table_oldVsBots_openings = 100
table_bots_openings = 200
