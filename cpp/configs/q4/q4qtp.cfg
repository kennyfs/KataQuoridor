# Configuration for KataQuoridor Four at a Table (Q4) QTP
bot = search
# model can be passed via command-line -model or specified here:
# model = models/q4_default.bin.gz
seed = 42

# Search limits (from gtp_quoridor.cfg)
maxVisits = 800  # gtp_quoridor.cfg
numSearchThreads = 4  # gtp_quoridor.cfg

# Neural net (from gtp_quoridor.cfg / selfplay_quoridor_v2.cfg)
nnCacheSizePowerOfTwo = 21  # selfplay_quoridor_v2.cfg
nnMutexPoolSizePowerOfTwo = 15  # selfplay_quoridor_v2.cfg
numNNServerThreadsPerModel = 1  # selfplay_quoridor_v2.cfg
nnMaxBatchSize = 16  # gtp_quoridor.cfg
nnRandomize = true  # selfplay_quoridor_v2.cfg

# Search exploration & PUCT (from selfplay_quoridor_v2.cfg)
cpuctExploration = 1.1  # selfplay_quoridor_v2.cfg
cpuctExplorationLog = 0.0  # selfplay_quoridor_v2.cfg
fpuReductionMax = 0.2  # selfplay_quoridor_v2.cfg
rootFpuReductionMax = 0.0  # selfplay_quoridor_v2.cfg
fpuParentWeightByVisitedPolicy = true  # selfplay_quoridor_v2.cfg
fpuParentWeightByVisitedPolicyPow = 2.0  # selfplay_quoridor_v2.cfg
valueWeightExponent = 0.5  # selfplay_quoridor_v2.cfg
useUncertainty = true  # selfplay_quoridor_v2.cfg
uncertaintyExponent = 1.0  # selfplay_quoridor_v2.cfg
uncertaintyCoeff = 0.25  # selfplay_quoridor_v2.cfg
numVirtualLossesPerThread = 1  # selfplay_quoridor_v2.cfg

# LCB selection (from selfplay_quoridor_v2.cfg)
useLcbForSelection = true  # selfplay_quoridor_v2.cfg
lcbStdevs = 5.0  # selfplay_quoridor_v2.cfg
minVisitPropForLCB = 0.15  # selfplay_quoridor_v2.cfg
useNonBuggyLcb = true  # selfplay_quoridor_v2.cfg

# Root noise and symmetries (from selfplay_quoridor_v2.cfg, C2: 8 for QTP)
rootNoiseEnabled = false  # default off for GTP play
rootDirichletNoiseTotalConcentration = 10.83  # selfplay_quoridor_v2.cfg
rootDirichletNoiseWeight = 0.25  # selfplay_quoridor_v2.cfg
rootDesiredPerChildVisitsCoeff = 2  # selfplay_quoridor_v2.cfg
rootPolicyTemperatureEarly = 1.25  # selfplay_quoridor_v2.cfg
rootPolicyTemperature = 1.1  # selfplay_quoridor_v2.cfg
rootNumSymmetriesToSample = 8  # Prompt C2: 8 for QTP

# Move selection temperature (from selfplay_quoridor_v2.cfg, C2: halflife 38 for Q4)
chosenMoveTemperatureEarly = 0.75  # selfplay_quoridor_v2.cfg
chosenMoveTemperatureHalflife = 38  # Prompt C2: 19 * 2 for 4 players
chosenMoveTemperature = 0.15  # selfplay_quoridor_v2.cfg
chosenMoveSubtract = 0  # selfplay_quoridor_v2.cfg
chosenMovePrune = 1  # selfplay_quoridor_v2.cfg

# Utility factor (from selfplay_quoridor_v2.cfg)
winLossUtilityFactor = 1.0  # selfplay_quoridor_v2.cfg
q4OpponentMode = maxn  # Plan §12.3: maxn | style | expect (q4match: per player, search:<model>@<visits>:<mode>)

# Removed features forced off (Plan §8.5 table)
staticScoreUtilityFactor = 0.0  # Plan §8.5: off
dynamicScoreUtilityFactor = 0.0  # Plan §8.5: off
policyOptimism = 0.0  # Plan §8.5: off
rootPolicyOptimism = 0.0  # Plan §8.5: off
useGraphSearch = false  # Plan §8.5: off
useEvalCache = false  # Plan §8.5: off
subtreeValueBiasFactor = 0.0  # Plan §8.5: off
avoidRepeatedPatternUtility = 0.0  # Plan §8.5: off
antiMirror = false  # Plan §8.5: off
playoutDoublingAdvantage = 0.0  # Plan §8.5: off
visitCapContempt = 0  # Plan §8.5: off
rootSymmetryPruning = false  # Plan §8.5: off
conservativePass = false  # Plan §8.5: off
enablePassingHacks = false  # Plan §8.5: off
enableMorePassingHacks = false  # Plan §8.5: off
fillDameBeforePass = false  # Plan §8.5: off
rootEndingBonusPoints = 0.0  # Plan §8.5: off
rootPruneUselessMoves = false  # Plan §8.5: off
ignorePreRootHistory = false  # Plan §8.5: off
ignoreAllHistory = false  # Plan §8.5: off
