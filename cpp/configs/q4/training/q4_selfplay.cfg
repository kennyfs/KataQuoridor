# KataQuoridor Four-at-a-Table (Q4) self-play configuration.
# Converted from selfplay_quoridor_v2.cfg for Round 4.

# Logs------------------------------------------------------------------------------------

logSearchInfo = false  # Duel value
logMoves = false  # Duel value
logGamesEvery = 50  # Duel value
logToStdout = true  # Duel value

# Data writing-----------------------------------------------------------------------------------

maxDataQueueSize = 2000  # Duel value
maxRowsPerTrainFile = 1000  # Duel value
firstFileRandMinProp = 0.15  # Duel value

# Fancy game selfplay settings--------------------------------------------------------------------

earlyForkGameProb = 0.04  # Duel value
earlyForkGameExpectedMoveProp = 0.025  # Duel value
forkGameProb = 0.01  # Duel value
forkGameMinChoices = 3  # Duel value
earlyForkGameMaxChoices = 12  # Duel value
forkGameMaxChoices = 36  # Duel value

initGamesWithPolicy = true  # Duel value
policyInitAreaProp = 0.08  # Duel value
sidePositionProb = 0.020  # Duel value

cheapSearchProb = 0.75  # Duel value
cheapSearchVisits = 250  # Duel value
cheapSearchTargetWeight = 0.0  # Duel value

reduceVisits = true  # Duel value
reduceVisitsThreshold = 0.9  # Duel value
reduceVisitsThresholdLookback = 3  # Duel value
reducedVisitsMin = 100  # Duel value
reducedVisitsWeight = 0.1  # Duel value

policySurpriseDataWeight = 0.5  # Duel value
valueSurpriseDataWeight = 0.1  # Duel value

switchNetsMidGame = true  # Duel value

q4EliminationProb = 0.03
# Population self-play (docs/q4/rounds/R7.md, Plan §11). With probability 1 - q4PopulationMixedProb all four seats are
# learners (the current net, one shared search); otherwise 1-3 learners and the other seats from the pool.
q4PopulationMixedProb = 0.5
# Opponent-aware search (Plan §12.3): maxn | style | expect. Own seats = the learner seats of the game.
q4OpponentMode = maxn
q4PopulationWeights = weak:1, snapshot:1, greedy:0.5, randomPawn:0.5, basher:0.5, grudge:0.5
q4PopulationObserverRowWeight = 0.25  # = 1 - cheapSearchProb: a non-learner ply yields a row as often as a learner ply (Plan §11)
q4PopulationWeakVisits = 1, 2, 4, 8, 16, 32
q4PopulationWeakTemperatureMin = 0.5
q4PopulationWeakTemperatureMax = 1.5
q4PopulationSnapshotAges = 2, 8, 32  # exports back from the current net (clamped to the oldest; duplicates collapse)
q4PopulationSnapshotVisits = 100
q4PopulationSnapshotChosenMoveTemperatureEarly = 0.60  # Duel's match_example.cfg, the Q4 halflife is the self-play one
q4PopulationSnapshotChosenMoveTemperature = 0.20
q4PopulationSnapshotCacheSizePowerOfTwo = 18  # NN cache of each snapshot evaluator (the learners' is nnCacheSizePowerOfTwo)

# Match / Rules---------------------------------------------------------------------------

numGameThreads = 256  # R8 Part C sweep (tf2_b4c192_q4-meta, population 0.5): 128 / 256 / 384 all at the 100 W cap; 256 + 2 server threads best
maxPlies = 400
repetitionDrawCount = 3  # Duel value
q4RepetitionDrawProb = 0.75  # Duel value
q4RepetitionDrawCounts = 3,4  # Duel value
q4RepetitionDrawCountWeights = 0.9,0.1  # Duel value

# Search limits---------------------------------------------------------------------------

maxVisits = 1000  # Duel value
numSearchThreads = 1

# GPU Settings----------------------------------------------------------------------------

nnMaxBatchSize = 256  # R8 Part C: 512 was slower (19.5k vs 20.6k NN rows/s at 256 threads, 1 server thread)
nnCacheSizePowerOfTwo = 20  # Q4: a filled entry holds NNOutput (1256 B) + Q4RawNNOutput (3432 B), sizeof via q4tool wallbench, plus two make_shared headers: ~4.7 KB; 2^20 entries ~= 4.9 GB
nnMutexPoolSizePowerOfTwo = 15  # Duel value
numNNServerThreadsPerModel = 2  # R8 Part C: 22.6k NN rows/s vs 20.6k with 1 (GPU 98% vs 89%, at the 100 W cap)
nnRandomize = true  # Duel value

cudaUseFP16 = auto  # Duel value
cudaUseNHWC = auto  # Duel value

# Root move selection and biases----------------------------------------------------------

chosenMoveTemperatureEarly = 0.75  # Duel value
chosenMoveTemperatureHalflife = 38
chosenMoveTemperature = 0.15  # Duel value
chosenMoveSubtract = 0  # Duel value
chosenMovePrune = 1  # Duel value

rootNoiseEnabled = true  # Duel value
rootDirichletNoiseTotalConcentration = 10.83  # Duel value
rootDirichletNoiseWeight = 0.25  # Duel value

rootDesiredPerChildVisitsCoeff = 2  # Duel value
rootNumSymmetriesToSample = 2

useLcbForSelection = true  # Duel value
lcbStdevs = 5.0  # Duel value
minVisitPropForLCB = 0.15  # Duel value

# Internal search params & Q4 off values---------------------------------------------------

winLossUtilityFactor = 1.0  # Duel value
staticScoreUtilityFactor = 0.0  # Q4 off value
dynamicScoreUtilityFactor = 0.0  # Q4 off value

policyOptimism = 0.0  # Q4 off value
rootPolicyOptimism = 0.0  # Q4 off value
useGraphSearch = false  # Q4 off value
useEvalCache = false  # Q4 off value
subtreeValueBiasFactor = 0.0  # Q4 off value
avoidRepeatedPatternUtility = 0.0  # Q4 off value
antiMirror = false  # Q4 off value
playoutDoublingAdvantage = 0.0  # Q4 off value
visitCapContempt = 0  # Q4 off value
rootSymmetryPruning = false  # Q4 off value
conservativePass = false  # Q4 off value
enablePassingHacks = false  # Q4 off value
enableMorePassingHacks = false  # Q4 off value
fillDameBeforePass = false  # Q4 off value
rootEndingBonusPoints = 0.0  # Q4 off value
rootPruneUselessMoves = false  # Q4 off value
ignorePreRootHistory = false  # Q4 off value
ignoreAllHistory = false  # Q4 off value

rootPolicyTemperatureEarly = 1.25  # Duel value
rootPolicyTemperature = 1.1  # Duel value

cpuctExploration = 1.1  # Duel value
cpuctExplorationLog = 0.0  # Duel value
fpuReductionMax = 0.2  # Duel value
rootFpuReductionMax = 0.0  # Duel value

numVirtualLossesPerThread = 1  # Duel value

valueWeightExponent = 0.5  # Duel value
subtreeValueBiasWeightExponent = 0.8  # Duel value
useNonBuggyLcb = true  # Duel value
fpuParentWeightByVisitedPolicy = true  # Duel value
fpuParentWeightByVisitedPolicyPow = 2.0  # Duel value

useUncertainty = true  # Duel value
uncertaintyExponent = 1.0  # Duel value
uncertaintyCoeff = 0.25  # Duel value
